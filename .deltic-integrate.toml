version = 1

# Release-only: integration NEVER bumps a crate version. A shared-version bump
# invalidates every crate's Cargo `-C metadata` fingerprint, forcing a full-workspace
# recompile each integration (the fleet convention for Cargo workspaces — see deltic
# and mddosem). ferrosintesis is published to crates.io; bump its version deliberately
# as part of a release, not per task. Per-integration identity rides the git SHA.
version_bump = "release-only"

# `--no-default-features` (the modeled-only synth the README offers to anyone who does
# not want the embedded samples) gets its OWN clippy step. It is a shipped configuration,
# and the default-feature clippy above cannot see it: every item reachable only through
# `embedded-samples` is compiled out, so dead code accumulated there unnoticed until
# MM-BUG-KILN-00070. One crate, no asset crates to build, so the cost is small.
#
# The matching modeled-only test step is paired with the default-feature workspace test.
# Some perceptual oracles genuinely require embedded samples; a no-default run cannot
# replace them. `no_default_gate_is_paired_with_embedded_sample_coverage` pins this pair
# so neither shipped configuration can silently lose its own coverage (MM-BUG-KILN-00090).
#
# `amp-lab` (dev-only egui/cpal GUI) is no longer a workspace member at all, so the steps
# below no longer name it. Keeping `--exclude amp-lab` would not have broken the gate —
# cargo only warns, "excluded package(s) `amp-lab` not found in workspace" (measured) —
# but a warning nobody can action is noise, so the flag is gone. It became its own
# workspace root because cargo resolves the ENTIRE graph before honouring `--exclude`:
# while it was a member, its ~200-crate registry tree was a prerequisite of every build
# here, so this very gate could not run on a machine without crates.io access. See the
# comment block in the root `Cargo.toml`.
#
# Consequence for this contract: the gate no longer sees amp-lab in ANY step, `fmt
# --all` included. It rides a small, sealed slice of the ferrosintesis realtime API, so
# a breaking change to that API will not be caught here. Run its checks from inside
# `crates/amp-lab/` when you touch it — or after changing the realtime API:
#   cargo fmt && cargo clippy --all-targets -- -D warnings && cargo test
#
# `tools/` is in the workspace component's paths, but every other command here is cargo —
# so until this step existed a change under `tools/` triggered a Rust-only gate and
# `tools/ferrosintesis-samples/test_prepare.py` (32 tests covering the sample-bake
# pipeline) never ran. MM-BUG-KILN-00062 and -00065 both cite a MANUAL `unittest` run as
# their evidence, which is what an unautomated suite looks like. `discover -s` is required
# rather than naming the module: the tests do a bare `import prepare`, and only discover
# puts the start directory on `sys.path`. Runs in ~8 s and needs `python` on PATH — the
# repo already requires it (every album builds with `python build.py`).
fallback = [
  { program = "cargo", args = ["fmt", "--all", "--", "--check"] },
  { program = "cargo", args = ["clippy", "--workspace", "--all-targets", "--locked", "--", "-D", "warnings"] },
  { program = "cargo", args = ["clippy", "-p", "ferrosintesis", "--no-default-features", "--all-targets", "--locked", "--", "-D", "warnings"] },
  { program = "cargo", args = ["test", "-p", "ferrosintesis", "--no-default-features", "--locked"] },
  { program = "cargo", args = ["test", "--workspace", "--locked"] },
  { program = "python", args = ["-m", "unittest", "discover", "-s", "tools/ferrosintesis-samples"] },
]

[[component]]
name = "workspace"
paths = ["crates/", "tools/"]
gate = [
  { program = "cargo", args = ["fmt", "--all", "--", "--check"] },
  { program = "cargo", args = ["clippy", "--workspace", "--all-targets", "--locked", "--", "-D", "warnings"] },
  { program = "cargo", args = ["clippy", "-p", "ferrosintesis", "--no-default-features", "--all-targets", "--locked", "--", "-D", "warnings"] },
  { program = "cargo", args = ["test", "-p", "ferrosintesis", "--no-default-features", "--locked"] },
  { program = "cargo", args = ["test", "--workspace", "--locked"] },
  { program = "python", args = ["-m", "unittest", "discover", "-s", "tools/ferrosintesis-samples"] },
]
