[workspace]
members = [
    "crates/ferrosintesis",
    "crates/ferrosintesis-cli",
    # The minimal FLAC decoder for the embedded banks. Its own crate because
    # THREE packages need it — `ferrosintesis` and the two drum banks, which
    # decode PCM inside the asset crate rather than handing bytes up. A shared
    # crate is what keeps that from becoming three copies of a bit reader.
    "crates/ferrosintesis-flac",
    "crates/ferrosintesis-samples-clavinet",
    "crates/ferrosintesis-samples-core",
    "crates/ferrosintesis-samples-drumkit",
    "crates/ferrosintesis-samples-drumkit2",
    "crates/ferrosintesis-samples-gong",
    "crates/ferrosintesis-samples-grand",
    "crates/ferrosintesis-samples-vcsl-steinway",
    "crates/ferrosintesis-samples-vcsl-kawai",
    "crates/ferrosintesis-samples-headroom",
    "crates/ferrosintesis-samples-musescore-grand",
    "crates/ferrosintesis-samples-dark-salamander",
    "crates/ferrosintesis-samples-ydp-grand",
    "crates/ferrosintesis-samples-honkytonk",
    "crates/ferrosintesis-samples-b1-upright",
    "crates/ferrosintesis-samples-musescore",
    "crates/ferrosintesis-samples-orchestral",
    "crates/ferrosintesis-samples-orchestral2",
    "crates/ferrosintesis-samples-sax",
    "crates/ferrosintesis-samples-strings",
    "crates/ferrosintesis-samples-ccby",
    "crates/ferrosintesis-samples-rain",
    "crates/ferrosintesis-samples-bass",
    "crates/ferrosintesis-samples-bottle",
    "crates/ferrosintesis-samples-mandolin",
    "crates/ferrosintesis-samples-fretnoise",
    "crates/render-catalog",
]
# `crates/amp-lab` (dev-only egui/cpal GUI) is deliberately NOT a member, and
# `default-members` is NOT the way to achieve that: cargo resolves the ENTIRE
# workspace graph before it honours `-p` or `--exclude`, so while amp-lab was a
# member its ~200-crate registry tree was a hard prerequisite of every build. On a
# machine with no crates.io access that failed outright —
# `error: no matching package named 'eframe' found` — even for
# `cargo build --offline -p ferrosintesis-cli`, and even for the
# `--workspace --exclude amp-lab` invocation the integration gate itself uses.
#
# Excising it makes this workspace's dependency closure 100% first-party path
# crates, which is what lets a fresh clone build and render the whole catalogue with
# no network at all (the samples are `include_bytes!`, and there is no build.rs).
# amp-lab is its own workspace root instead — same trick as `fuzz/`. Trade-off: a
# root `cargo build --release` and `cargo fmt --all` no longer reach it, so run
# `cargo build/clippy/test/fmt` inside `crates/amp-lab/` when you touch it.
resolver = "2"

# `cargo test` renders real audio. Unoptimised, the lib-test suite takes 287.6 s on KILN;
# at opt-level 2 it is a fraction of that (measured, see the commit that added this). The
# integration gate runs this profile on every integration, and a multi-minute wait is what
# pushes agents toward scoped runs instead of the full suite.
#
# `test` inherits from `dev`, so this covers the crate's own unit tests. Dependencies still
# build under `dev` — fine, the sample crates are inert data and the DSP being timed is all
# in ferrosintesis itself. No assertion changes: this is purely how fast the same tests run.
[profile.test]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
# render-catalog isolates a per-track synth panic with `catch_unwind`, which is a
# no-op under `panic = "abort"`. Unwind is already the default; pinning it here
# documents the dependency so a future size/speed tweak can't silently remove it.
panic = "unwind"

