# Dev tool for choosing the driven-guitar defaults by ear (Part B).
#
# A workspace MEMBER so a bare `cargo build --release` at the repo root builds it.
# It pulls in egui + cpal (~200 crates), which the shipped crates do not — so the
# integration gate in `.deltic-integrate.toml` runs `--workspace --exclude
# amp-lab` to avoid compiling that tree on every integration for a tool it never
# gates. The release profile (LTO) is inherited from the workspace root.
[package]
name = "amp-lab"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["glow", "default_fonts"] }
cpal = "0.15"
ferrosintesis = { path = "../ferrosintesis" }
