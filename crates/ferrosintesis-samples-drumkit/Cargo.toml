[package]
name = "ferrosintesis-samples-drumkit"
version = "0.1.0"
edition = "2021"
# Keep this in lockstep with every other crate in the workspace: the declaration is what
# turns on clippy's `incompatible_msrv` lint, so a crate without it is silently unpoliced
# (this one was, until 2026-07-25 — it was the only sample crate missing the line).
rust-version = "1.87"
description = "Embedded CC0 sampled core drum-kit bank for ferrosintesis"
license = "CC0-1.0"
repository = "https://github.com/0x4D44/ferrosintesis"
readme = "README.md"
include = ["src/**", "samples/**", "README.md", "PROVENANCE.md", "LICENSE-CC0"]

[lib]
path = "src/lib.rs"
