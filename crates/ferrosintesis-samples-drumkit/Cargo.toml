[package]
name = "ferrosintesis-samples-drumkit"
version = "0.2.0"
edition = "2021"
# Keep this in lockstep with every other crate in the workspace: the declaration is what
# turns on clippy's `incompatible_msrv` lint, so a crate without it is silently unpoliced
# (this one was, until 2026-07-25 — it was the only sample crate missing the line).
rust-version = "1.87"
description = "Embedded CC0 sampled core drum-kit bank for ferrosintesis"
license = "CC0-1.0"
repository = "https://github.com/0x4D44/ferrosintesis"
readme = "README.md"
include = ["src/**", "samples/**", "README.md", "PROVENANCE.md", "LICENSE-CC0"]

[lib]
path = "src/lib.rs"

[dependencies]
# The shared FLAC decoder. This crate decodes PCM itself (see `decode_wav`), so
# unlike the other asset crates it needs a decoder rather than just embedding
# bytes. First-party path crate, so the workspace stays free of registry
# dependencies and the no-network build survives. Keep it on ONE line: a
# multi-line inline table is invalid TOML 1.0 and cargo at our MSRV (1.87)
# refuses the manifest outright.
ferrosintesis-flac = { path = "../ferrosintesis-flac", version = "=0.1.0" }
