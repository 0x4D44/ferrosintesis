[package]
name = "ferrosintesis-samples-drumkit2"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Embedded CC0 accent-cymbal banks for ferrosintesis (crash, sizzle crash, splash, china) — overflow from the size-capped -drumkit crate"
license = "CC0-1.0"
repository = "https://github.com/0x4D44/ferrosintesis"
readme = "README.md"
include = ["src/**", "samples/**", "README.md", "PROVENANCE.md", "LICENSE-CC0"]

[lib]
path = "src/lib.rs"

[dependencies]
# For the `Bank` / `BankSource` types only — this crate embeds its own WAVs and declares
# its own `SOURCE`. Keeping ONE `Bank` type across both halves is what lets the consumer
# hold a single `&'static Bank` without caring which crate the bytes came from. Keep the
# dependency on ONE line: a multi-line inline table is invalid TOML 1.0 and cargo at our
# MSRV (1.87) refuses the manifest outright.
ferrosintesis-samples-drumkit = { path = "../ferrosintesis-samples-drumkit", version = "=0.1.0" }
