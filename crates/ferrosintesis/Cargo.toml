[package]
name = "ferrosintesis"
version = "0.21.46"
edition = "2021"
rust-version = "1.87"
description = "A General MIDI synthesizer and MIDI-to-WAV renderer with no SoundFont and no dependencies"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0x4D44/ferrosintesis"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]
keywords = ["midi", "synthesizer", "audio", "dsp"]
categories = ["multimedia::audio"]

[features]
default = ["embedded-samples"]
embedded-samples = [
    "dep:ferrosintesis-samples-clavinet",
    "dep:ferrosintesis-samples-core",
    "dep:ferrosintesis-samples-drumkit",
    "dep:ferrosintesis-samples-gong",
    "dep:ferrosintesis-samples-grand",
    "dep:ferrosintesis-samples-vcsl-steinway",
    "dep:ferrosintesis-samples-vcsl-kawai",
    "dep:ferrosintesis-samples-headroom",
    "dep:ferrosintesis-samples-musescore-grand",
    "dep:ferrosintesis-samples-dark-salamander",
    "dep:ferrosintesis-samples-ydp-grand",
    "dep:ferrosintesis-samples-honkytonk",
    "dep:ferrosintesis-samples-musescore",
    "dep:ferrosintesis-samples-orchestral",
    "dep:ferrosintesis-samples-orchestral2",
    "dep:ferrosintesis-samples-sax",
    "dep:ferrosintesis-samples-strings",
    "dep:ferrosintesis-samples-bass",
    "dep:ferrosintesis-samples-ccby",
]

[dependencies]
# The `=` pins are deliberate: the sample bank IS the version, and a floating
# bank would break bit-identical re-renders for a pinned ferrosintesis.
# NB: keep each dependency on ONE line — a multi-line inline table is invalid
# TOML 1.0 and cargo at our MSRV (1.87) refuses to parse it.
ferrosintesis-samples-clavinet = { path = "../ferrosintesis-samples-clavinet", version = "=0.1.0", optional = true }
ferrosintesis-samples-core = { path = "../ferrosintesis-samples-core", version = "=0.1.0", optional = true }
ferrosintesis-samples-drumkit = {
    path = "../ferrosintesis-samples-drumkit",
    version = "=0.1.0",
    optional = true,
}
ferrosintesis-samples-gong = { path = "../ferrosintesis-samples-gong", version = "=0.1.0", optional = true }
ferrosintesis-samples-grand = { path = "../ferrosintesis-samples-grand", version = "=0.1.0", optional = true }
ferrosintesis-samples-vcsl-steinway = { path = "../ferrosintesis-samples-vcsl-steinway", version = "=0.1.0", optional = true }
ferrosintesis-samples-vcsl-kawai = { path = "../ferrosintesis-samples-vcsl-kawai", version = "=0.1.0", optional = true }
ferrosintesis-samples-headroom = { path = "../ferrosintesis-samples-headroom", version = "=0.1.0", optional = true }
ferrosintesis-samples-musescore-grand = { path = "../ferrosintesis-samples-musescore-grand", version = "=0.1.0", optional = true }
ferrosintesis-samples-dark-salamander = { path = "../ferrosintesis-samples-dark-salamander", version = "=0.1.0", optional = true }
ferrosintesis-samples-ydp-grand = { path = "../ferrosintesis-samples-ydp-grand", version = "=0.1.0", optional = true }
ferrosintesis-samples-honkytonk = { path = "../ferrosintesis-samples-honkytonk", version = "=0.1.0", optional = true }
ferrosintesis-samples-musescore = { path = "../ferrosintesis-samples-musescore", version = "=0.1.0", optional = true }
ferrosintesis-samples-orchestral = {
    path = "../ferrosintesis-samples-orchestral",
    version = "=0.1.0",
    optional = true,
}
ferrosintesis-samples-orchestral2 = { path = "../ferrosintesis-samples-orchestral2", version = "=0.1.0", optional = true }
ferrosintesis-samples-sax = { path = "../ferrosintesis-samples-sax", version = "=0.1.0", optional = true }
ferrosintesis-samples-strings = { path = "../ferrosintesis-samples-strings", version = "=0.1.0", optional = true }
ferrosintesis-samples-bass = { path = "../ferrosintesis-samples-bass", version = "=0.1.0", optional = true }
ferrosintesis-samples-ccby = { path = "../ferrosintesis-samples-ccby", version = "=0.1.0", optional = true }

[lib]
path = "src/lib.rs"
