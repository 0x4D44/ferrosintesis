[package]
name = "ferrosintesis"
version = "0.21.57"
edition = "2021"
rust-version = "1.87"
description = "A pure-Rust General MIDI synthesizer and MIDI-to-WAV renderer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0x4D44/ferrosintesis"
readme = "README.md"
# `examples/**` ships deliberately: `examples/quickstart.rs` IS the README's code block, and
# it exists so `clippy --all-targets` fails when the API drifts from what the front page
# claims. A published crate without it invites the drift the file was written to prevent.
include = ["src/**", "examples/**", "tests/**", "README.md", "CHANGELOG.md", "NOTICE", "LICENSE-APACHE", "LICENSE-MIT"]
keywords = ["midi", "synthesizer", "audio", "dsp"]
categories = ["multimedia::audio"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ferrosintesis_repository_tests)'] }

# docs.rs builds with default features unless told otherwise, and our default feature pulls
# in 24 asset crates embedding ~107 MiB of PCM — a download-and-compile that risks blowing
# the docs.rs build timeout and shipping the crate with NO documentation at all.
#
# Building docs without them costs nothing: no public item is `cfg`-gated on
# `embedded-samples`. The single visible difference is the runtime VALUE returned by
# `embedded_samples_available()`, which is documented as build-dependent anyway.
[package.metadata.docs.rs]
no-default-features = true

[features]
default = ["embedded-samples"]
embedded-samples = [
    "dep:ferrosintesis-samples-clavinet",
    "dep:ferrosintesis-samples-core",
    "dep:ferrosintesis-samples-drumkit",
    "dep:ferrosintesis-samples-drumkit2",
    "dep:ferrosintesis-samples-gong",
    "dep:ferrosintesis-samples-grand",
    "dep:ferrosintesis-samples-vcsl-steinway",
    "dep:ferrosintesis-samples-vcsl-kawai",
    "dep:ferrosintesis-samples-headroom",
    "dep:ferrosintesis-samples-musescore-grand",
    "dep:ferrosintesis-samples-ydp-grand",
    "dep:ferrosintesis-samples-honkytonk",
    "dep:ferrosintesis-samples-b1-upright",
    "dep:ferrosintesis-samples-musescore",
    "dep:ferrosintesis-samples-orchestral",
    "dep:ferrosintesis-samples-orchestral2",
    "dep:ferrosintesis-samples-sax",
    "dep:ferrosintesis-samples-strings",
    "dep:ferrosintesis-samples-bass",
    "dep:ferrosintesis-samples-bottle",
    "dep:ferrosintesis-samples-ccby",
    "dep:ferrosintesis-samples-rain",
    "dep:ferrosintesis-samples-mandolin",
    "dep:ferrosintesis-samples-fretnoise",
]

[dependencies]
ferrosintesis-flac = { path = "../ferrosintesis-flac", version = "=0.1.0" }
# The `=` pins are deliberate: the sample bank IS the version, and a floating
# bank would break bit-identical re-renders for a pinned ferrosintesis.
# NB: keep each dependency on ONE line — a multi-line inline table is invalid
# TOML 1.0 and cargo at our MSRV (1.87) refuses to parse it.
ferrosintesis-samples-clavinet = { path = "../ferrosintesis-samples-clavinet", version = "=0.1.0", optional = true }
ferrosintesis-samples-core = { path = "../ferrosintesis-samples-core", version = "=0.1.0", optional = true }
ferrosintesis-samples-drumkit = { path = "../ferrosintesis-samples-drumkit", version = "=0.1.0", optional = true }
ferrosintesis-samples-drumkit2 = { path = "../ferrosintesis-samples-drumkit2", version = "=0.1.0", optional = true }
ferrosintesis-samples-gong = { path = "../ferrosintesis-samples-gong", version = "=0.1.0", optional = true }
ferrosintesis-samples-grand = { path = "../ferrosintesis-samples-grand", version = "=0.1.0", optional = true }
ferrosintesis-samples-vcsl-steinway = { path = "../ferrosintesis-samples-vcsl-steinway", version = "=0.1.0", optional = true }
ferrosintesis-samples-vcsl-kawai = { path = "../ferrosintesis-samples-vcsl-kawai", version = "=0.1.0", optional = true }
ferrosintesis-samples-headroom = { path = "../ferrosintesis-samples-headroom", version = "=0.1.0", optional = true }
ferrosintesis-samples-musescore-grand = { path = "../ferrosintesis-samples-musescore-grand", version = "=0.1.0", optional = true }
ferrosintesis-samples-ydp-grand = { path = "../ferrosintesis-samples-ydp-grand", version = "=0.1.1", optional = true }
ferrosintesis-samples-honkytonk = { path = "../ferrosintesis-samples-honkytonk", version = "=0.1.1", optional = true }
ferrosintesis-samples-b1-upright = { path = "../ferrosintesis-samples-b1-upright", version = "=0.1.0", optional = true }
ferrosintesis-samples-musescore = { path = "../ferrosintesis-samples-musescore", version = "=0.1.0", optional = true }
ferrosintesis-samples-orchestral = { path = "../ferrosintesis-samples-orchestral", version = "=0.1.0", optional = true }
ferrosintesis-samples-orchestral2 = { path = "../ferrosintesis-samples-orchestral2", version = "=0.1.0", optional = true }
ferrosintesis-samples-sax = { path = "../ferrosintesis-samples-sax", version = "=0.1.0", optional = true }
ferrosintesis-samples-strings = { path = "../ferrosintesis-samples-strings", version = "=0.1.0", optional = true }
ferrosintesis-samples-bass = { path = "../ferrosintesis-samples-bass", version = "=0.1.0", optional = true }
ferrosintesis-samples-bottle = { path = "../ferrosintesis-samples-bottle", version = "=0.1.0", optional = true }
ferrosintesis-samples-ccby = { path = "../ferrosintesis-samples-ccby", version = "=0.1.0", optional = true }
ferrosintesis-samples-rain = { path = "../ferrosintesis-samples-rain", version = "=0.1.1", optional = true }
ferrosintesis-samples-mandolin = { path = "../ferrosintesis-samples-mandolin", version = "=0.1.0", optional = true }
ferrosintesis-samples-fretnoise = { path = "../ferrosintesis-samples-fretnoise", version = "=0.1.0", optional = true }

[lib]
path = "src/lib.rs"
